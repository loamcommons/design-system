name: Identity integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify canonical identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install raster inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes imagemagick librsvg2-bin
      - name: Check source and committed assets
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 source/build.py --check
          python3 source/verify.py --check
          python3 source/verify_github.py
          python3 source/guide.py
          git diff --exit-code -- index.html
